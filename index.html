
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruitageo — Good Mood. Great Fruit.</title>
<meta name="description" content="Fresh fruit bowls, strawberry treats, acai bowls, shakes and juices by Fruitageo.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #ff5c91;
  --pink-light: #ffe1eb;
  --green: #d6ef8b;
  --yellow: #ffdc68;
  --cream: #fffaf0;
  --dark: #28251f;
  --muted: #756b64;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  font-family: "DM Sans", sans-serif;
  background: var(--cream);
  color: var(--dark);
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}

.container {
  width: min(1160px, 88%);
  margin: auto;
}

/* NAVIGATION */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--cream);
  border-bottom: 1px solid #28251f12;
}

nav {
  min-height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font: 700 29px "Fredoka", sans-serif;
  letter-spacing: -1px;
}

.logo-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  background: var(--pink);
  color: white;
  border-radius: 12px 12px 12px 3px;
  transform: rotate(-7deg);
}

.logo span:last-child {
  color: var(--pink);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 30px;
}

.nav-links a {
  font-size: 12px;
  font-weight: 800;
}

.nav-links a:hover {
  color: var(--pink);
}

.nav-button {
  padding: 13px 20px;
  border-radius: 50px;
  background: var(--dark);
  color: white;
  transition: .2s;
}

.nav-button:hover {
  background: var(--pink);
  color: white !important;
}

/* HERO */

.hero {
  background: var(--pink-light);
  padding: 65px 0 55px;
  overflow: hidden;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  align-items: center;
  gap: 35px;
}

.tag {
  display: inline-block;
  padding: 10px 15px;
  background: white;
  border-radius: 30px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1.5px;
}

.hero h1 {
  margin: 25px 0 20px;
  font: 700 clamp(55px, 7vw, 88px)/.93 "Fredoka", sans-serif;
  letter-spacing: -3px;
}

.hero h1 span {
  color: var(--pink);
}

.hero-copy > p {
  max-width: 450px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.9;
}

.hero-buttons {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  margin-top: 30px;
}

.primary-btn {
  display: inline-block;
  padding: 16px 23px;
  border-radius: 50px;
  background: var(--dark);
  color: white;
  font-size: 12px;
  font-weight: 900;
  transition: .2s;
}

.primary-btn:hover {
  background: var(--pink);
  transform: translateY(-3px);
}

.secondary-link {
  font-size: 12px;
  font-weight: 900;
}

.hero-note {
  margin-top: 40px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1.5px;
}

.hero-art {
  min-height: 430px;
  position: relative;
  display: grid;
  place-items: center;
}

.art-circle {
  width: min(370px, 90%);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--yellow);
}

.bowl {
  position: absolute;
  z-index: 2;
  width: 280px;
  filter: drop-shadow(0 20px 14px #8c46502a);
  transform: rotate(-6deg);
}

.bowl-top {
  height: 100px;
  border: 8px solid white;
  border-radius: 50%;
  background: #fff3d5;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  font-size: 34px;
}

.bowl-front {
  height: 120px;
  margin-top: -15px;
  border: 7px solid white;
  border-top: 0;
  border-radius: 5px 5px 70px 70px;
  background: linear-gradient(140deg, #ff8bad, #ed4f83);
  color: white;
  display: grid;
  place-items: center;
  font: 600 25px "Fredoka", sans-serif;
}

.floating-fruit {
  position: absolute;
  z-index: 3;
  font-size: 62px;
  animation: float 4s ease-in-out infinite;
}

.fruit-a { top: 7%; left: 8%; }
.fruit-b { top: 8%; right: 4%; animation-delay: .7s; }
.fruit-c { bottom: 9%; left: 5%; animation-delay: 1.2s; }
.fruit-d { bottom: 8%; right: 5%; animation-delay: .4s; }

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-7deg); }
  50% { transform: translateY(-12px) rotate(8deg); }
}

/* TICKER */

.ticker {
  overflow: hidden;
  background: var(--green);
  padding: 17px 0;
}

.ticker-track {
  width: max-content;
  display: flex;
  gap: 35px;
  align-items: center;
  font: 600 19px "Fredoka", sans-serif;
  letter-spacing: 1px;
  animation: slide 22s linear infinite;
}

@keyframes slide {
  to { transform: translateX(-50%); }
}

/* INTRO */

.section {
  padding: 95px 0;
}

.section-label {
  color: var(--pink);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 2px;
}

.intro {
  display: grid;
  grid-template-columns: .8fr 1.5fr;
  gap: 35px;
}

.intro h2,
.section-heading h2 {
  margin: 13px 0;
  font: 600 clamp(38px, 5vw, 58px)/1.05 "Fredoka", sans-serif;
  letter-spacing: -1.5px;
}

.intro h2 span,
.section-heading h2 span {
  color: var(--pink);
}

.intro p {
  max-width: 600px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
}

/* MENU */

.menu-section {
  background: #fff1df;
}

.section-heading {
  text-align: center;
  margin-bottom: 45px;
}

.section-heading > p {
  color: var(--muted);
  font-size: 13px;
}

.menu-category {
  margin-bottom: 55px;
  scroll-margin-top: 110px;
}

.category-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}

.category-heading h3 {
  font: 600 32px "Fredoka", sans-serif;
}

.category-heading h3 span {
  color: var(--pink);
}

.category-heading p {
  color: var(--muted);
  font-size: 12px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 17px;
}

.product-card {
  padding: 23px;
  min-width: 0;
  min-height: 235px;
  display: flex;
  flex-direction: column;
  border-radius: 17px;
  transition: .25s;
}

.product-card:hover {
  transform: translateY(-6px);
  box-shadow: 0
